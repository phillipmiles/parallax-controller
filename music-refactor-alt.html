    <link href="css/style-music.css" type="text/css" rel="stylesheet" />
    <script type="text/javascript" src="build/parallax.js"></script>
  </head>
  <body>

              <img

              />
              <div class="dog-01-head-01-group">
                <img
                  src="./assets/images/dog-01-head-01.svg"
                  class="dog-01-head-01"
                />
                <img
                  src="./assets/images/dog-01-mouth-01.svg"
                  class="dog-01-mouth-01"
                />
                <img
                  src="./assets/images/dog-01-eye-left-02.svg"
                  class="dog-01-eye-left-02"
                />
                <img
                  src="./assets/images/dog-01-eye-right-02.svg"
                  class="dog-01-eye-right-02"
                />
                <img
                  src="./assets/images/dog-01-eye-left-01.svg"
                  class="dog-01-eye-left-01"
                />
                <img
                  src="./assets/images/dog-01-eye-right-01.svg"

                />
                <img
                  src="./assets/images/dog-01-eyebrow-left-01.svg"

                />
                <img
                  src="./assets/images/dog-01-eyebrow-right-01.svg"

                <img
                  src="./assets/images/dog-01-iris-left-01.svg"

                <img

              </div>
            </div>
            <div id="dog-02" class="dog">
              <img
                src="./assets/images/dog-02-legs-01.svg"
                class="dog-02-legs-01"
              />
              <div class="dog-02-body-01-group">
                <img
                  src="./assets/images/dog-02-tail-01.svg"
                  class="dog-02-tail-01"
                />
                <img
                  src="./assets/images/dog-02-body-01.svg"
                  class="dog-02-body-01"
                />
                <div class="dog-02-head-01-group">
                  <img
                    src="./assets/images/dog-02-head-01.svg"

                  />
                  <img
                    src="./assets/images/dog-02-eyes-01.svg"
                    class="dog-02-eyes-01"
                  />
                </div>
              </div>
            </div>
          </div>
          <div class="song-container">
            <div>
              <h1>Are You Ready?</h1>
              <h2>By Castle Heist</h2>
              <div id="start-container" class="start-container">
                <button id="start-button" class="start-button">
                  Start song
                </button>
              </div>
              <div id="song-container" class="song-contents hidden">
                <div class="song-scrollbar">
                  <div class="song-scrollbar-indicator-wrap">
                    <div class="song-scrollbar-indicator"></div>
                  </div>
                </div>
                <ul>
                  <li id="section-count-in"><span>Count in</span></li>
                  <li id="section-intro"><span>Intro</span></li>
                  <li id="section-verse-1"><span>Verse 1</span></li>
                  <li id="section-chorus-1"><span>Chorus 1</span></li>
                  <li id="section-verse-2"><span>Verse 2</span></li>
                  <li id="section-chorus-2"><span>Chorus 2</span></li>
                  <li id="section-outro-intro"><span>Outro start</span></li>
                  <li id="section-outro"><span>Outro</span></li>
                </ul>
              </div>
            </div>
          </div>
        </div>
        <!-- <div class="footer">
          <div id="scroll-reminder" class="scroll-reminder hidden">
            Scroll to progress song
          </div>
        </div> -->
      </div>
    </div>

    <script>
      const songSections = [
        {
          id: 'section-count-in',
          title: 'Count in',
          interval: 4,
          source: new parallax.AudioSource('assets/music/count-in.mp3'),
        },
        {
          id: 'section-intro',
          title: 'Intro',
          interval: 8,
          source: new parallax.AudioSource('assets/music/intro-loop.mp3'),
        },
        {
          id: 'section-verse-1',
          title: 'Verse 1',
          interval: 8,
          source: new parallax.AudioSource('assets/music/verse-1.mp3'),
        },
        {
          id: 'section-chorus-1',
          title: 'Chorus 1',
          interval: 8,
          source: new parallax.AudioSource('assets/music/chorus-1-pre.mp3'),
          offset: 3,
        },
        {
          id: 'section-verse-2',
          title: 'Verse 2',
          interval: 8,
          source: new parallax.AudioSource('assets/music/verse-2.mp3'),
        },
        {
          id: 'section-chorus-2',
          title: 'Chorus 2',
          interval: 8,
          source: new parallax.AudioSource('assets/music/chorus-2-pre.mp3'),
          offset: 4,
        },
        {
          id: 'section-outro-intro',
          title: 'Outro start',
          interval: 8,
          source: new parallax.AudioSource('assets/music/outro-intro.mp3'),
        },
        {
          id: 'section-outro',
          title: 'Outro',
          interval: 8,
          source: new parallax.AudioSource('assets/music/outro.mp3'),
        },
      ];

      const distance = window.innerHeight * 3;

      const makePercentOf = (distance) => {
        return (percent) => {
          if (typeof percent === 'number') {
            return percent * distance;
          } else {
            return percent.map((item) => item * distance);
          }
          throw 'PercentOf expected a number or array of nubmers.';
        };
      };

      const percentOfDistance = makePercentOf(distance);

      const timeTill = (time, interval, offsetInterval = 0) => {
        // const time = timeElapsed - delayIntervalLength + offsetIntervalLength;
        console.log('offsetInterval', offsetInterval);
        const timeElapsed = (performance.now() - time) / 1000;
        const timeThroughBeat = (timeElapsed + offsetInterval) % interval;
        return interval - timeThroughBeat;
      };

      const parallaxController = new parallax.ParallaxController({
        distance: distance,
        scrollRestoration: false,
        onUpdate: () => {},
      });

      const BASE_INTERVAL = 0.5454545454545454;
      let queuedIntervalMultipler;
      let currentIntervalMultiplier;

      const onNextSequence = () => {
        currentIntervalMultiplier = queuedIntervalMultipler;
        const activeSection = document.getElementsByClassName('active');

        for (let element of activeSection) {
          element.classList.remove('active');
        }

        const pendingSection = document.getElementsByClassName('pending');
        for (let element of pendingSection) {
          element.classList.remove('pending');
          element.classList.add('active');
        }
      };

      const sequence = new parallax.ParallaxAudioSequence(onNextSequence);

      songSections.forEach((section, index) => {
        const manager = new parallax.ParallaxAudioManager(section.source, {
          triggerDirection: 'both',
          loop: true,
          maxPlaying: 1,
        });

        const sectionDuration = 1 / songSections.length;
        const sectionStart = sectionDuration * index;

        // XXXXXXXXXXXX
        // MAKE START TRIGGERS THE ONLY TRIGGERS AND USE CURRENTMANAGER
        // IN SEQUENCER TO GET THE MANAGER OF WHAT IS NORMALLY REFERENCED IN THE
        // THE STOP TRIGGER!!!!!
        // XXXXXXXXXXXX
        const startTrigger = new parallax.ParallaxTrigger(
          percentOfDistance([sectionStart, sectionStart + sectionDuration]),
          {
            triggerDirection: 'both',
            disabled: true,
            onTrigger: (scrollPos) => {
              // const pendingEls = document.getElementsByClassName('pending');
              // for (const element of pendingEls) {
              //   element.classList.remove('pending');
              // }

              const songSectionEl = document.getElementById(section.id);
              if (!songSectionEl.classList.contains('active')) {
                songSectionEl.classList.add('pending');
              }

              // If triggered manager is already currently playing sound
              if (
                section.manager.sounds.find((sound) => sound === sequence.sound)
              ) {
                // Make sure manager loops again and cancel it's stopwhen.
                sequence.sound.sourceNode.loop = true;
                sequence.sound.stopWhen(1000000);
              } else if (
                !sequence.queue.find((manager) => manager === section.manager)
              ) {
                queuedIntervalMultipler = section.interval;
                sequence.add(section.manager);

                // If triggered sound has an offset then we need to let audio be allowed to
                // loop if offset requires it to stop in the next loop and we also need to
                // set an offset stopwhen.
                if (section.offset) {
                  sequence.sound.sourceNode.loop = true; // Need to make sure it loops again
                  const time = timeTill(
                    sequence.timeStarted,
                    BASE_INTERVAL * currentIntervalMultiplier, // XXX HAVE TO FORCE LAST SONG TO A 4 INTERVAL THOUGH
                    BASE_INTERVAL * section.offset
                  );
                  console.log('SET STOP WHEN');
                  sequence.sound.stopWhen(time);
                } else {
                  sequence.sound.sourceNode.loop = false; // Make sure current sound is still not looping
                  console.log('REMOVE LOOP');
                  timeTill(
                    sequence.timeStarted,
                    BASE_INTERVAL * currentIntervalMultiplier
                  );
                  // sequence.sound.stopWhen(1000000);
                }
              }
            },
          }
        );

        let stopTriggerAt;
        let stopTriggerDirection;

        if (index === 0) {
          stopTriggerAt = sectionDuration;
          stopTriggerDirection = 'forwards';
        } else if (index === songSections.length - 1) {
          stopTriggerAt = 1 - sectionDuration;
          stopTriggerDirection = 'backwards';
        } else {
          stopTriggerAt = [sectionStart, sectionStart + sectionDuration];
          stopTriggerDirection = 'both-reversed';
        }

        const stopTrigger = new parallax.ParallaxTrigger(
          percentOfDistance(stopTriggerAt),
          {
            triggerDirection: stopTriggerDirection,
            onTrigger: (scrollPos) => {
              const songSectionEl = document.getElementById(section.id);
              songSectionEl.classList.remove('pending');
              // If manager is currently the playing sound.
              if (
                section.manager.sounds.find((sound) => sound === sequence.sound)
              ) {
                sequence.sound.sourceNode.loop = false;
                const time = section.offset
                  ? timeTill(
                      sequence.timeStarted,
                      BASE_INTERVAL * section.interval,
                      BASE_INTERVAL * section.offset
                    )
                  : timeTill(
                      sequence.timeStarted,
                      BASE_INTERVAL * section.interval
                    );

                sequence.sound.stopWhen(time);
              } else {
                if (section.offset) {
                  // NEED TO RECALC Interval  baseed stopwhen
                }
              }

              const queueIndex = sequence.queue.findIndex(
                (manager) => manager === section.manager
              );
              if (queueIndex >= 0) {
                sequence.remove(queueIndex);
              }
            },
          }
        );

        section.manager = manager;
        section.startTrigger = startTrigger;
        section.stopTrigger = stopTrigger;
      });

      songSections.forEach((section) => {
        parallaxController.addAudio(section.manager);
        console.log(section);
        parallaxController.addTrigger(section.startTrigger);
        parallaxController.addTrigger(section.stopTrigger);
      });

      const animScrollbar = new parallax.ParallaxAnimation(
        '.song-scrollbar-indicator-wrap',
        [
          {
            attribute: 'translateY',
            values: [0, 100],
            unit: '%',
            easing: 'linear',
            positions: percentOfDistance([0, 1]),
          },
        ]
      );

      parallaxController.addAnimation(animScrollbar);

      const turnOnAudio = async () => {
        parallaxController.init();
        document.body.removeEventListener('click', turnOnAudio);

        const startButton = document.getElementById('start-button');
        startButton.style.opacity = '0.5';
        startButton.innerHTML = 'loading..';
        startButton.disabled = true;

        for (const section of songSections) {
          await section.source.load();
        }

        songSections.forEach((section) => {
          section.startTrigger.disabled = false;

          const sectionEl = document.getElementById(section.id);

          const offsetTime = section.offset
            ? BASE_INTERVAL * 1000 * section.offset
            : 0;

          sectionEl.style['animation-duration'] =
            BASE_INTERVAL * 1000 * section.interval + 'ms';

          if (
            section.startTrigger.withinRange(
              parallaxController.scrollHistory[0]
            )
          ) {
            section.startTrigger.trigger();
            currentIntervalMultiplier = section.interval;
            sectionEl.classList.add('active');
            sectionEl.classList.remove('pending');
          }
        });

        const dog1Element = document.getElementById('dog-01');
        dog1Element.style.display = 'none';
        const dog2Element = document.getElementById('dog-02');
        dog2Element.style.display = 'block';

        const startContainer = document.getElementById('start-container');
        startContainer.classList.add('hidden');

        const songContainer = document.getElementById('song-container');
        songContainer.classList.remove('hidden');

        const scrollReminderEl = document.getElementById('scroll-reminder');
        scrollReminderEl.classList.remove('hidden');

        // parallaxController.initAudio();
      };

      const startButton = document.getElementById('start-button');
      startButton.addEventListener('click', turnOnAudio);
    </script>
  </body>
</html>
