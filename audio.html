<!DOCTYPE html>

<html lang="en">
<head>
	<title>Parallax</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<link href="css/style.css" type="text/css" rel="stylesheet" />
    <script type="text/javascript" src="build/parallax.js"></script>
</head>
<body>
	<div id="test-block">
		<section id="intro" class="wrapper">
			<div id="test-box-01" class="box square01"></div>

			<div id="test-box-01" class="box square02"></div>

			<div id="test-box-01" class="box square03"></div>
		</div>
    </div>
    
    <script>
      var scenes = [
        {
          'wrapper' : '#intro',
          'duration' : '150%',
          audio: [
            {
              src: 'assets/sfx/rocky.wav',
              isLooped: true,
              props: [{
                  type: 'gain',
                  values: [0, 0, 100, 0, 0],
                  keys: ['0%', '40%', '50%', '60%', '100%'],
                  isMotionControlled: true
              }],
            }
          ],
          'animations' : [
            {
              'selector' : '.square01',
              'translateY' : {
                'positions' : ['0%', '0%', '-25%', '25%'],
                'keys' : ['0%', '40%', '80%', '100%'],
              },
              'translateX' : '-35%',
              'opacity' : {
                'positions' : [1, 0.6, 0.6, 0],
                'keys' : ['0%', '75%', '75%', '100%'],
              },
              'scale' : 2
            }, 
            {
              'selector' : '.square02',
              'translateY' : '-15%',
              'opacity' : 1
            }
          ]
        },
        {
          'wrapper' : '#intro',
          'duration' : '150%',
          'animations' : [
            {
              'translateY' : ['-15%', '-15%'],
              'selector' : '.square02',
              'rotate' : -120
            } , {
              'selector' : '.square03',
              'translateY' : -120,
              'opacity' : 1,
              'scale' : 0.25
            }
          ]
        }
      ];

      // const run = () => {

</body>
