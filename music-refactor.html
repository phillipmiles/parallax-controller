<!DOCTYPE html>

<html lang="en">
  <head>
    <title>Parallax</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="css/style-demo.css" type="text/css" rel="stylesheet" />
    <script type="text/javascript" src="build/parallax.js"></script>
  </head>
  <body>
    <div id="stage">
      <div class="slide slide-1">
        <div class="slide-circle slide-1-circle">
          <h1>Water</h1>
        </div>
      </div>
      <div class="slide slide-2">
        <div class="slide-circle slide-2-circle">
          <h1>Earth</h1>
        </div>
      </div>
      <div class="slide slide-3">
        <div class="slide-circle slide-3-circle">
          <h1>Fire</h1>
        </div>
      </div>
    </div>

    <script>
      var scenes = [
        {
          wrapper: '#stage',
          duration: '300%',
          animations: [
            {
              selector: '.slide-1',
              opacity: {
                positions: [0, 1, 1],
                keys: ['0%', '10%', '100%'],
              },
            },
            {
              selector: '.slide-1-circle',
              scale: {
                positions: [4, 0, 0],
                keys: ['0%', '33%', '100%'],
              },
            },
            {
              selector: '.slide-2',
              opacity: {
                positions: [0, 0, 1, 1],
                keys: ['0%', '33%', '43%', '100%'],
              },
            },
            {
              selector: '.slide-2-circle',
              scale: {
                positions: [4, 4, 0, 0],
                keys: ['0%', '33%', '66%', '100%'],
              },
            },
            {
              selector: '.slide-3',
              opacity: {
                positions: [0, 0, 1, 1],
                keys: ['0%', '66%', '73%', '100%'],
              },
            },
            {
              selector: '.slide-3-circle',
              scale: {
                positions: [4, 4, 0],
                keys: ['0%', '66%', '100%'],
              },
            },
          ],
        },
      ];

      const distance = window.innerHeight * 3;

      const makePercentOf = (distance) => {
        return (percent) => {
          if (typeof percent === 'number') {
            return percent * distance;
          } else {
            return percent.map((item) => item * distance);
          }
          throw 'PercentOf expected a number or array of nubmers.';
        };
      };

      const percentOfDistance = makePercentOf(distance);

      const parallaxController = new parallax.ParallaxController({
        distance: distance,
        scrollRestoration: true,
      });

      const scheduler = new parallax.ParallaxAudioScheduler({
        // sequenceInterval: 4, // 1 / (110bpm / 60) = 0.5454 * 4 beats = 2181.8
        baseInterval: 0.5454545454545454, // in seconds
      });

      const musicCountIn = new parallax.AudioSource(
        'assets/music/count-in.mp3'
      );
      const musicIntro = new parallax.AudioSource(
        'assets/music/intro-loop.mp3'
      );

      const musicCountInManager = new parallax.ParallaxAudioManager(
        musicCountIn,
        {
          start: percentOfDistance([0, 0.3]),
          stop: percentOfDistance(0.3),
          triggerDirection: 'both',
          scheduler: scheduler,
          schedulerInterval: 4,
          loop: true,
          maxPlaying: 1,
        }
      );

      const musicIntroManager = new parallax.ParallaxAudioManager(musicIntro, {
        start: percentOfDistance([0.3, 0.5]),
        stop: percentOfDistance([0.3, 0.5]),
        triggerDirection: 'both',
        scheduler: scheduler,
        schedulerInterval: 8,
        loop: true,
        maxPlaying: 1,
      });

      parallaxController.addAudio(musicCountInManager);
      parallaxController.addAudio(musicIntroManager);

      parallaxController.init();

      const turnOnAudio = async () => {
        document.body.removeEventListener('click', turnOnAudio);
        await musicCountIn.load();
        await musicIntro.load();

        parallaxController.initAudio();
      };

      document.body.addEventListener('click', turnOnAudio);
    </script>
  </body>
</html>
