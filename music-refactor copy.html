<!DOCTYPE html>

<html lang="en">
  <head>
    <title>Parallax</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="css/style-demo.css" type="text/css" rel="stylesheet" />
    <script type="text/javascript" src="build/parallax.js"></script>
  </head>
  <body>
    <div id="stage">
      <div class="slide slide-1">
        <div class="slide-circle slide-1-circle">
          <h1>Water</h1>
        </div>
      </div>
      <div class="slide slide-2">
        <div class="slide-circle slide-2-circle">
          <h1>Earth</h1>
        </div>
      </div>
      <div class="slide slide-3">
        <div class="slide-circle slide-3-circle">
          <h1>Fire</h1>
        </div>
      </div>
    </div>

    <script>
      const distance = window.innerHeight * 3;

      const makePercentOf = (distance) => {
        return (percent) => {
          if (typeof percent === 'number') {
            return percent * distance;
          } else {
            return percent.map((item) => item * distance);
          }
          throw 'PercentOf expected a number or array of nubmers.';
        };
      };

      const percentOfDistance = makePercentOf(distance);

      const timeTill = (time, interval, offsetInterval = 0) => {
        // const time = timeElapsed - delayIntervalLength + offsetIntervalLength;
        console.log('offsetInterval', offsetInterval);
        const timeElapsed = (performance.now() - time) / 1000;
        const timeThroughBeat = (timeElapsed + offsetInterval) % interval;
        return interval - timeThroughBeat;
      };

      const parallaxController = new parallax.ParallaxController({
        distance: distance,
        scrollRestoration: false,
        onUpdate: () => {},
      });

      const BASE_INTERVAL = 0.5454545454545454;
      let queuedIntervalMultipler;
      let currentIntervalMultiplier;

      const musicCountIn = new parallax.AudioSource(
        'assets/music/count-in.mp3'
      );
      const musicIntro = new parallax.AudioSource(
        'assets/music/intro-loop.mp3'
      );
      const musicVerse1 = new parallax.AudioSource('assets/music/verse-1.mp3');
      const musicChorus1 = new parallax.AudioSource(
        'assets/music/chorus-1-pre.mp3'
      );

      const musicCountInManager = new parallax.ParallaxAudioManager(
        musicCountIn,
        {
          triggerDirection: 'both',
          loop: true,
          maxPlaying: 1,
        }
      );

      const musicIntroManager = new parallax.ParallaxAudioManager(musicIntro, {
        triggerDirection: 'both',
        loop: true,
        maxPlaying: 1,
      });

      const musicVerse1Manager = new parallax.ParallaxAudioManager(
        musicVerse1,
        {
          triggerDirection: 'both',
          loop: true,
          maxPlaying: 1,
        }
      );
      const musicChorus1Manager = new parallax.ParallaxAudioManager(
        musicChorus1,
        {
          triggerDirection: 'both',
          loop: true,
          maxPlaying: 1,
        }
      );

      const onNextSequence = () => {
        currentIntervalMultiplier = queuedIntervalMultipler;
      };

      const sequence = new parallax.ParallaxAudioSequence(onNextSequence);

      const COUNTIN_INTERVAL = 4;
      const startCountIn = new parallax.ParallaxTrigger(
        percentOfDistance([0, 0.3]),
        {
          triggerDirection: 'both',
          disabled: true,
          onTrigger: (scrollPos) => {
            if (
              musicCountInManager.sounds.find(
                (sound) => sound === sequence.sound
              )
            ) {
              console.log('loop 1');
              sequence.sound.sourceNode.loop = true;
            } else if (
              !sequence.queue.find((manager) => manager === musicCountInManager)
            ) {
              console.log('Add 1');
              queuedIntervalMultipler = COUNTIN_INTERVAL;
              sequence.add(musicCountInManager);
            }
          },
        }
      );

      const stopCountIn = new parallax.ParallaxTrigger(percentOfDistance(0.3), {
        triggerDirection: 'forwards',
        onTrigger: (scrollPos) => {
          console.log(sequence.sound);
          if (
            musicCountInManager.sounds.find((sound) => sound === sequence.sound)
          ) {
            console.log('unloop 1');
            sequence.sound.sourceNode.loop = false;
          }
        },
      });

      parallaxController.addTrigger(startCountIn);
      parallaxController.addTrigger(stopCountIn);

      const INTRO_INTERVAL = 8;
      const startIntro = new parallax.ParallaxTrigger(
        percentOfDistance([0.3, 0.5]),
        {
          triggerDirection: 'both',
          disabled: true,
          onTrigger: (scrollPos) => {
            if (
              musicIntroManager.sounds.find((sound) => sound === sequence.sound)
            ) {
              sequence.sound.sourceNode.loop = true;
              sequence.sound.stopWhen(1000000);
            } else if (
              !sequence.queue.find((manager) => manager === musicIntroManager)
            ) {
              queuedIntervalMultipler = INTRO_INTERVAL;
              sequence.add(musicIntroManager);
            }
          },
        }
      );

      const stopIntro = new parallax.ParallaxTrigger(
        percentOfDistance([0.3, 0.5]),
        {
          triggerDirection: 'both-reversed',
          onTrigger: (scrollPos) => {
            if (
              musicIntroManager.sounds.find((sound) => sound === sequence.sound)
            ) {
              sequence.sound.sourceNode.loop = false;
              const time = timeTill(sequence.timeStarted, BASE_INTERVAL * 8);
              sequence.sound.stopWhen(time);
            }

            const queueIndex = sequence.queue.findIndex(
              (manager) => manager === musicIntroManager
            );
            if (queueIndex >= 0) {
              sequence.remove(queueIndex);
            }
          },
        }
      );

      parallaxController.addTrigger(startIntro);
      parallaxController.addTrigger(stopIntro);

      const VERSER1_INTERVAL = 8;
      const startVerse1 = new parallax.ParallaxTrigger(
        percentOfDistance([0.5, 0.7]),
        {
          triggerDirection: 'both',
          disabled: true,
          onTrigger: (scrollPos) => {
            if (
              musicVerse1Manager.sounds.find(
                (sound) => sound === sequence.sound
              )
            ) {
              sequence.sound.sourceNode.loop = true;
              sequence.sound.stopWhen(1000000);
            } else if (
              !sequence.queue.find((manager) => manager === musicVerse1Manager)
            ) {
              queuedIntervalMultipler = VERSER1_INTERVAL;
              sequence.add(musicVerse1Manager);
            }
          },
        }
      );

      const stopVerse1 = new parallax.ParallaxTrigger(
        percentOfDistance([0.5, 0.7]),
        {
          triggerDirection: 'both-reversed',
          onTrigger: (scrollPos) => {
            if (
              musicVerse1Manager.sounds.find(
                (sound) => sound === sequence.sound
              )
            ) {
              sequence.sound.sourceNode.loop = false;
              const time = timeTill(sequence.timeStarted, BASE_INTERVAL * 8);
              sequence.sound.stopWhen(time);
            }

            const queueIndex = sequence.queue.findIndex(
              (manager) => manager === musicVerse1Manager
            );
            if (queueIndex >= 0) {
              sequence.remove(queueIndex);
            }
          },
        }
      );

      parallaxController.addTrigger(startVerse1);
      parallaxController.addTrigger(stopVerse1);

      const CHORUS1_INTERVAL = 8;
      const startChorus1 = new parallax.ParallaxTrigger(
        percentOfDistance([0.7, 1]),
        {
          triggerDirection: 'both',
          disabled: true,
          onTrigger: (scrollPos) => {
            if (
              musicChorus1Manager.sounds.find(
                (sound) => sound === sequence.sound
              )
            ) {
              sequence.sound.sourceNode.loop = true;
              sequence.sound.stopWhen(1000000);
            } else if (
              !sequence.queue.find((manager) => manager === musicChorus1Manager)
            ) {
              sequence.add(musicChorus1Manager);
              sequence.sound.sourceNode.loop = true; // Need to make sure it loops again

              queuedIntervalMultipler = CHORUS1_INTERVAL;
              console.log(
                'currentIntervalMultiplier',
                currentIntervalMultiplier
              );
              const time = timeTill(
                sequence.timeStarted,
                BASE_INTERVAL * currentIntervalMultiplier, // XXX HAVE TO FORCE LAST SONG TO A 4 INTERVAL THOUGH
                BASE_INTERVAL * 3
              );

              sequence.sound.stopWhen(time);
            }
          },
        }
      );

      const stopChorus1 = new parallax.ParallaxTrigger(percentOfDistance(0.7), {
        triggerDirection: 'backwards',
        onTrigger: (scrollPos) => {
          if (
            musicChorus1Manager.sounds.find((sound) => sound === sequence.sound)
          ) {
            sequence.sound.sourceNode.loop = false;
            const time = timeTill(
              sequence.timeStarted,
              BASE_INTERVAL * 8,
              BASE_INTERVAL * -3
            );
            sequence.sound.stopWhen(time);
          }

          const queueIndex = sequence.queue.findIndex(
            (manager) => manager === musicChorus1Manager
          );
          if (queueIndex >= 0) {
            sequence.remove(queueIndex);
          }
        },
      });

      parallaxController.addTrigger(startChorus1);
      parallaxController.addTrigger(stopChorus1);

      parallaxController.addAudio(musicCountInManager);
      parallaxController.addAudio(musicIntroManager);
      parallaxController.addAudio(musicVerse1Manager);
      parallaxController.addAudio(musicChorus1Manager);

      const animSlide1 = new parallax.ParallaxAnimation('.slide-1', [
        {
          attribute: 'opacity',
          values: [0, 1, 1],
          positions: percentOfDistance([0, 0.1, 1]),
        },
      ]);

      const animSlide1Circle = new parallax.ParallaxAnimation(
        '.slide-1-circle',
        [
          {
            attribute: 'scale',
            values: [4, 0, 0],
            positions: percentOfDistance([0, 0.33, 1]),
          },
        ]
      );

      const animSlide2 = new parallax.ParallaxAnimation('.slide-2', [
        {
          attribute: 'opacity',
          values: [0, 0, 1, 1],
          positions: percentOfDistance([0, 0.33, 0.43, 1]),
        },
      ]);

      const animSlide2Circle = new parallax.ParallaxAnimation(
        '.slide-2-circle',
        [
          {
            attribute: 'scale',
            values: [4, 4, 0, 0],
            positions: percentOfDistance([0, 0.33, 0.66, 1]),
          },
        ]
      );

      const animSlide3 = new parallax.ParallaxAnimation('.slide-3', [
        {
          attribute: 'opacity',
          values: [0, 0, 1, 1],
          positions: percentOfDistance([0, 0.66, 0.73, 1]),
        },
      ]);

      const animSlide3Circle = new parallax.ParallaxAnimation(
        '.slide-3-circle',
        [
          {
            attribute: 'scale',
            values: [4, 4, 0],
            positions: percentOfDistance([0, 0.66, 1]),
          },
        ]
      );

      parallaxController.addAnimation(animSlide1);
      parallaxController.addAnimation(animSlide1Circle);
      parallaxController.addAnimation(animSlide2);
      parallaxController.addAnimation(animSlide2Circle);
      parallaxController.addAnimation(animSlide3);
      parallaxController.addAnimation(animSlide3Circle);

      parallaxController.init();

      const turnOnAudio = async () => {
        document.body.removeEventListener('click', turnOnAudio);
        await musicCountIn.load();
        await musicIntro.load();
        await musicVerse1.load();
        await musicChorus1.load();

        startCountIn.disabled = false;
        startIntro.disabled = false;
        startVerse1.disabled = false;
        startChorus1.disabled = false;

        if (startCountIn.withinRange(parallaxController.scrollHistory[0])) {
          startCountIn.trigger();
          currentIntervalMultiplier = COUNTIN_INTERVAL;
        } else if (
          startIntro.withinRange(parallaxController.scrollHistory[0])
        ) {
          startIntro.trigger();
          currentIntervalMultiplier = INTRO_INTERVAL;
        } else if (
          startVerse1.withinRange(parallaxController.scrollHistory[0])
        ) {
          startVerse1.trigger();
          currentIntervalMultiplier = VERSER1_INTERVAL;
        } else if (
          startChorus1.withinRange(parallaxController.scrollHistory[0])
        ) {
          startChorus1.trigger();
          currentIntervalMultiplier = CHORUS1_INTERVAL;
        }

        // parallaxController.initAudio();
      };

      document.body.addEventListener('click', turnOnAudio);
    </script>
  </body>
</html>
