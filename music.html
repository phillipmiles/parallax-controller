<!DOCTYPE html>

<html lang="en">
  <head>
    <title>Parallax</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="css/style-music.css" type="text/css" rel="stylesheet" />
    <script type="text/javascript" src="build/parallax.js"></script>
  </head>
  <body>
    <div id="stage">
      <div class="container">
        <div class="song-menu">
          <h3 class="menu-1">1, 2, 3, 4</h3>
          <h3 class="menu-2">Intro</h3>
          <h3 class="menu-3">Verse 1</h3>
          <h3 class="menu-4">Chorus 1</h3>
          <h3>...</h3>
          <h3>...</h3>
          <h3>...</h3>
        </div>
        <div id="metronome" class="metronome"></div>
      </div>
    </div>

    <script>
      var scenes = [
        {
          wrapper: '#stage',
          duration: '300%',
          audio: [
            {
              src: 'assets/music/count-in.mp3',
              loopSrc: 'assets/music/count-in.mp3', // plays src but play loop enabled
              sequenceGroup: 'song', // Find other audios with same sequence group, look to them for trigger stops and starts
              sequenceInterval: 4, // 1 / (110bpm / 60) = 0.5454 * 4 beats = 2181.8
              triggerStart: ['0%', '25%'],
              triggerStop: '25%',
              bpm: 110,
              volume: 1,
              loop: true,
              triggerDirection: 'both',
              maxPlaying: 1,
              props: [],
            },
            {
              src: 'assets/music/intro-loop.mp3',
              sequenceGroup: 'song',
              triggerStart: ['25%', '50%'],
              triggerStop: ['25%', '50%'],
              sequenceInterval: 16,
              // bpm: 110,
              bpm: 110,
              volume: 1,
              loop: true,
              triggerDirection: 'both', // Direction of scroll trigger
              maxPlaying: 1, // Allow multiple sounds to trigger and play at once
              props: [
                // {
                //   id: 'fadeInOut',
                //   type: 'gain',
                //   values: [0, 0, 1, 1, 0, 0],
                //   keys: ['0%', '30%', '35%', '65%', '70%', '100%'],
                //   isMotionControlled: true,
                // },
              ],
            },
            {
              src: 'assets/music/verse-1.mp3',
              sequenceGroup: 'song',
              sequenceInterval: 16,
              triggerStart: ['50%', '75%'],
              triggerStop: ['50%', '75%'],
              bpm: 110,
              // bpm: 27.5,
              volume: 1,
              loop: true,
              triggerDirection: 'both', // Direction of scroll trigger
              maxPlaying: 1, // Allow multiple sounds to trigger and play at once
              props: [
                // {
                //   id: 'fadeInOut',
                //   type: 'gain',
                //   values: [0, 0, 1, 1],
                //   keys: ['0%', '60%', '65%', '100%'],
                //   isMotionControlled: true,
                // },
              ],
            },
            {
              src: 'assets/music/chorus-1-pre.mp3',
              sequenceGroup: 'song',
              sequenceInterval: 16,
              sequenceDelay: -3,
              triggerStart: ['75%', '100%'],
              triggerStop: '75%',
              bpm: 110,
              // bpm: 27.5,
              volume: 1,
              loop: true,
              triggerDirection: 'both', // Direction of scroll trigger
              maxPlaying: 1, // Allow multiple sounds to trigger and play at once
              props: [
                // {
                //   id: 'fadeInOut',
                //   type: 'gain',
                //   values: [0, 0, 1, 1],
                //   keys: ['0%', '60%', '65%', '100%'],
                //   isMotionControlled: true,
                // },
              ],
            },
          ],
          animations: [
            {
              selector: '.menu-1',
              opacity: {
                positions: [1, 1, 0.5, 0.5],
                keys: ['0%', '25%', '26%', '100%'],
              },
              scale: {
                positions: [1.4, 1.4, 1, 1],
                keys: ['0%', '25%', '26%', '100%'],
              },
            },
            {
              selector: '.menu-2',
              opacity: {
                positions: [0.5, 0.5, 1, 1, 0.5, 0.5],
                keys: ['0%', '25%', '26%', '49%', '50%', '100%'],
              },
              scale: {
                positions: [1, 1, 1.4, 1.4, 1, 1],
                keys: ['0%', '25%', '26%', '49%', '50%', '100%'],
              },
            },
            {
              selector: '.menu-3',
              opacity: {
                positions: [0.5, 0.5, 1, 1, 0.5, 0.5],
                keys: ['0%', '49%', '50%', '74%', '75%', '100%'],
              },
              scale: {
                positions: [1, 1, 1.4, 1.4, 1, 1],
                keys: ['0%', '49%', '50%', '74%', '75%', '100%'],
              },
            },
            {
              selector: '.menu-4',
              opacity: {
                positions: [0.5, 0.5, 1, 1],
                keys: ['0%', '74%', '75%', '100%'],
              },
              scale: {
                positions: [1, 1, 1.4, 1.4],
                keys: ['0%', '74%', '75%', '100%'],
              },
            },
          ],
        },
      ];

      // const run = () => {

      const control = parallax.parallaxController(scenes, {
        scrollRestoration: true,
      });
      console.log(scenes);

      const turnOnAudio = () => {
        control.enableAudio();
        const metronome = document.getElementById('metronome');
        metronome.className = `${metronome.className} active`;
      };

      document.body.addEventListener('click', turnOnAudio);
      // console.log(parallax)
      // }
      // document.addEventListener('DOMContentLoaded', run, false);

      // console.log('rgun');
      // var scrollIntervalID = setInterval(updateDebugger, 10);

      //function updateDebugger() {
      //    console.log(pc.getCurrentKeyframe());
      //}
    </script>
  </body>
</html>
