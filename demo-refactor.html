<!DOCTYPE html>

<html lang="en">
  <head>
    <title>Parallax</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="css/style-demo.css" type="text/css" rel="stylesheet" />
    <script type="text/javascript" src="build/parallax.js"></script>
  </head>
  <body>
    <div id="stage">
      <div class="slide slide-1">
        <div class="slide-circle slide-1-circle">
          <h1>Water</h1>
        </div>
      </div>
      <div class="slide slide-2">
        <div class="slide-circle slide-2-circle">
          <h1>Earth</h1>
        </div>
      </div>
      <div class="slide slide-3">
        <div class="slide-circle slide-3-circle">
          <h1>Fire</h1>
        </div>
      </div>
    </div>

    <script>
      var scenes = [
        {
          wrapper: '#stage',
          duration: '300%',
          animations: [
            {
              selector: '.slide-1',
              opacity: {
                positions: [0, 1, 1],
                keys: ['0%', '10%', '100%'],
              },
            },
            {
              selector: '.slide-1-circle',
              scale: {
                positions: [4, 0, 0],
                keys: ['0%', '33%', '100%'],
              },
            },
            {
              selector: '.slide-2',
              opacity: {
                positions: [0, 0, 1, 1],
                keys: ['0%', '33%', '43%', '100%'],
              },
            },
            {
              selector: '.slide-2-circle',
              scale: {
                positions: [4, 4, 0, 0],
                keys: ['0%', '33%', '66%', '100%'],
              },
            },
            {
              selector: '.slide-3',
              opacity: {
                positions: [0, 0, 1, 1],
                keys: ['0%', '66%', '73%', '100%'],
              },
            },
            {
              selector: '.slide-3-circle',
              scale: {
                positions: [4, 4, 0],
                keys: ['0%', '66%', '100%'],
              },
            },
          ],
        },
      ];

      const distance = window.innerHeight * 3;

      const makePercentOf = (distance) => {
        return (percent) => {
          if (typeof percent === 'number') {
            return percent * distance;
          } else {
            return percent.map((item) => item * distance);
          }
          throw 'PercentOf expected a number or array of nubmers.';
        };
      };

      const percentOfDistance = makePercentOf(distance);

      const parallaxController = new parallax.ParallaxController({
        distance: distance,
      });

      const audioWater = new parallax.AudioSource('assets/sfx/water.mp3');
      const audioEarth = new parallax.AudioSource('assets/sfx/earth.wav');
      const audioFire = new parallax.AudioSource('assets/sfx/fire.wav');

      const audioWaterManager = new parallax.ParallaxAudioManager(audioWater, {
        start: percentOfDistance([0, 0.3]),
        triggerDirection: 'both',
        loop: true,
        maxPlaying: 1,
        effects: [
          {
            handler: parallax.ParallaxAudioGainEffect,
            values: [0, 1, 1, 0, 0],
            keys: percentOfDistance([0, 0.05, 0.14, 0.32, 1]),
          },
        ],
      });

      const audioEarthManager = new parallax.ParallaxAudioManager(audioEarth, {
        start: percentOfDistance([0.2, 0.7]),
        triggerDirection: 'both',
        loop: true,
        maxPlaying: 1,
        effects: [
          {
            handler: parallax.ParallaxAudioGainEffect,
            values: [0, 0, 1, 1, 0, 0],
            keys: percentOfDistance([0, 0.3, 0.37, 0.55, 0.64, 1]),
          },
        ],
      });

      const audioFireManager = new parallax.ParallaxAudioManager(audioFire, {
        start: percentOfDistance([0.5, 1]),
        triggerDirection: 'both',
        loop: true,
        maxPlaying: 1,
        effects: [
          {
            handler: parallax.ParallaxAudioGainEffect,
            values: [0, 0, 1, 1, 0],
            keys: percentOfDistance([0, 0.63, 0.7, 0.8, 1]),
          },
        ],
      });

      parallaxController.addAudio(audioWaterManager);
      parallaxController.addAudio(audioEarthManager);
      parallaxController.addAudio(audioFireManager);

      parallaxController.init();

      const turnOnAudio = async () => {
        document.body.removeEventListener('click', turnOnAudio);
        await audioWater.load();
        await audioEarth.load();
        await audioFire.load();
        parallaxController.initAudio();
      };

      document.body.addEventListener('click', turnOnAudio);
    </script>
  </body>
</html>
